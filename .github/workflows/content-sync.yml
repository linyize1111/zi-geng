name: Content sync

on:
  schedule:
    # Monday 16:00 UTC = Tuesday 00:00 Asia/Taipei
    - cron: "0 16 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/content/**"
      - "public/content/**"
      - ".github/workflows/content-sync.yml"
      - "supabase/APPLY_REFRESH_UNLIMITED_ONLY.sql"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing secret. Set SUPABASE_SERVICE_ROLE_KEY (Legacy API → service_role) OR SUPABASE_SECRET_KEY (API Keys → secret / sb_secret_…)."
            exit 1
          fi

      # Always import committed seeds first (reliable, no network crawl dependency)
      - name: Import bundled vocab + quotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node scripts/content/import-vocab.mjs scripts/content/seed-literary-vocab.json
          node scripts/content/import-quotes.mjs scripts/content/seed-themed-quotes.json

      - name: Archive self-authored maxims (字耕箴言)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/content/archive-self-quotes.mjs

      - name: Crawl multi-source extras (best-effort; never overwrite merged literary seed)
        continue-on-error: true
        run: |
          npm run content:crawl -- --vocab=80 --quotes=40

      - name: Import crawled extras (best-effort)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -f scripts/content/fetched-wiktionary.json ]; then
            node scripts/content/import-vocab.mjs scripts/content/fetched-wiktionary.json
          fi
          if [ -f scripts/content/fetched-wikiquote.json ]; then
            node scripts/content/import-quotes.mjs scripts/content/fetched-wikiquote.json
          fi

      - name: Apply unlimited-refresh RPC via Management SQL API
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ypyiqysgfwgxcmmsylob
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skip RPC DDL (data import still done)"
            exit 0
          fi
          node scripts/content/apply-sql-file.mjs supabase/APPLY_REFRESH_UNLIMITED_ONLY.sql

      - name: Commit seed if changed
        id: seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/content/seed-literary-vocab.json \
            scripts/content/seed-writer-vocab.json \
            scripts/content/seed-moe-revised.json \
            scripts/content/seed-idioms-raw.json \
            scripts/content/literary-terms.txt \
            scripts/content/seed-themed-quotes.json \
            scripts/content/fetched-wiktionary.json \
            scripts/content/fetched-wikiquote.json \
            scripts/content/seed-multi-source-vocab.json \
            public/content/seed-literary-vocab.json \
            public/content/seed-writer-vocab.json \
            public/content/seed-themed-quotes.json \
            public/content/seed-multi-source-vocab.json \
            public/content/seed-wikiquote.json || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(content): auto multi-source refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site (seed updated)
        if: steps.seed.outputs.changed == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAIN_SITE_URL: ${{ secrets.VITE_MAIN_SITE_URL }}
          VITE_APP_BASE_PATH: /zi-geng/
          VITE_USE_MOCK_ADAPTER: "false"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.seed.outputs.changed == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.seed.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: seed-literary-vocab
          path: |
            scripts/content/seed-literary-vocab.json
            public/content/seed-literary-vocab.json
            scripts/content/seed-themed-quotes.json
