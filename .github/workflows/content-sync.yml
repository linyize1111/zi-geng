name: Content sync

on:
  schedule:
    # Weekly incremental update — Tuesday 00:00 Asia/Taipei
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "bulk = one-shot large multi-source crawl; update = incremental"
        required: true
        default: bulk
        type: choice
        options:
          - bulk
          - update
  push:
    branches: [main]
    paths:
      - "scripts/content/**"
      - "public/content/**"
      - ".github/workflows/content-sync.yml"
      - "supabase/APPLY_REFRESH_UNLIMITED_ONLY.sql"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing secret. Set SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SECRET_KEY."
            exit 1
          fi

      - name: Resolve crawl mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'bulk' }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=update" >> "$GITHUB_OUTPUT"
          fi

      - name: Import bundled seeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node scripts/content/import-vocab.mjs scripts/content/seed-literary-vocab.json
          node scripts/content/import-quotes.mjs scripts/content/seed-themed-quotes.json
          node scripts/content/import-prompts.mjs scripts/content/seed-writing-prompts.json
          node scripts/content/import-novel-tasks.mjs scripts/content/seed-novel-plan-tasks.json
          node scripts/content/import-craft.mjs scripts/content/seed-craft-cards.json
          if [ -f scripts/content/seed-themed-vocab.json ]; then
            node scripts/content/import-vocab.mjs scripts/content/seed-themed-vocab.json
          fi
          if [ -f scripts/content/seed-multi-source-vocab.json ]; then
            node scripts/content/import-vocab.mjs scripts/content/seed-multi-source-vocab.json
          fi

      - name: Purge low-value vocab (半日／蒙衝-class)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/content/purge-low-value-vocab.mjs

      - name: Archive self-authored maxims
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/content/archive-self-quotes.mjs

      - name: Purge bio-as-quote rows
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/content/purge-bio-quotes.mjs

      - name: Discover knowledge topics
        continue-on-error: true
        run: node scripts/content/discover-knowledge-topics.mjs

      - name: Build knowledge candidates
        continue-on-error: true
        run: node scripts/content/build-knowledge-candidates.mjs

      - name: Score knowledge candidates
        continue-on-error: true
        run: node scripts/content/quality-score.mjs scripts/content/generated/seed-knowledge-candidates.json

      - name: Import knowledge candidates
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KNOWLEDGE_WEEKLY_CAP: "20"
          KNOWLEDGE_AUTO_ACTIVE_CAP: "8"
        run: |
          if [ -f scripts/content/generated/seed-knowledge-candidates.json ]; then
            node scripts/content/import-knowledge.mjs scripts/content/generated/seed-knowledge-candidates.json --auto-activate
          else
            echo "No knowledge candidates — skip"
          fi

      - name: Multi-source crawl (vocab only — quotes blocked)
        continue-on-error: true
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          # Do NOT crawl/import wikiquote: theme/author pages often yield bios as "quotes".
          if [ "$MODE" = "bulk" ]; then
            npm run content:crawl -- --mode=bulk --vocab=450 --quotes=0
          else
            npm run content:crawl -- --mode=update --vocab=100 --quotes=0
          fi

      - name: Import crawled vocab extras
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -f scripts/content/fetched-wiktionary.json ]; then
            node scripts/content/import-vocab.mjs scripts/content/fetched-wiktionary.json
          fi
          # Intentionally skip fetched-wikiquote.json — use curated seed-themed-quotes only.

      - name: Apply unlimited-refresh RPC via Management SQL API
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ypyiqysgfwgxcmmsylob
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skip RPC DDL"
            exit 0
          fi
          node scripts/content/apply-sql-file.mjs supabase/APPLY_REFRESH_UNLIMITED_ONLY.sql

      - name: Commit seed if changed
        id: seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetched-* are gitignored crawl caches; do not git add them.
          git add \
            scripts/content/seed-literary-vocab.json \
            scripts/content/seed-writer-vocab.json \
            scripts/content/seed-moe-revised.json \
            scripts/content/seed-moe-concised.json \
            scripts/content/seed-idioms-raw.json \
            scripts/content/seed-themed-vocab.json \
            scripts/content/seed-craft-cards.json \
            scripts/content/literary-terms.txt \
            scripts/content/seed-themed-quotes.json \
            scripts/content/seed-writing-prompts.json \
            scripts/content/seed-novel-plan-tasks.json \
            scripts/content/seed-multi-source-vocab.json \
            scripts/content/generated/seed-knowledge-candidates.json \
            scripts/content/generated/knowledge-topic-candidates.json \
            scripts/content/topic-graph/knowledge-topics.json \
            public/content/*.json || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(content): sync seeds (${{ steps.mode.outputs.mode }})"
            # Crawl caches / untracked noise can block pull --rebase.
            git stash push --include-untracked -m "content-sync-pre-rebase" || true
            # Main may move (CI/prettier/docs) while this long job runs.
            git pull --rebase origin main
            git stash pop || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site (seed updated)
        if: steps.seed.outputs.changed == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAIN_SITE_URL: ${{ secrets.VITE_MAIN_SITE_URL }}
          VITE_APP_BASE_PATH: /zi-geng/
          VITE_USE_MOCK_ADAPTER: "false"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.seed.outputs.changed == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.seed.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: content-seeds
          path: |
            scripts/content/seed-literary-vocab.json
            scripts/content/fetched-wiktionary.json
            scripts/content/fetched-wikiquote.json
            scripts/content/generated/seed-knowledge-candidates.json
            scripts/content/generated/knowledge-topic-candidates.json
            public/content/seed-literary-vocab.json
            public/content/seed-knowledge-candidates.json
